services:
  backend:
    image: todoapp-backend:latest
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    image: todoapp-frontend:latest
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped